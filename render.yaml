services:
  # ---------------------------------------------------------------------------
  # Docker runtime is REQUIRED, not optional.
  #
  # This file previously used `runtime: python` with a `buildCommand`. Render's
  # native Python runtime cannot run apt-get, so tesseract-ocr was never
  # installed and every OCR request failed with "OCR is not configured on this
  # server". Switching to `runtime: docker` makes Render build ./Dockerfile,
  # which installs tesseract-ocr + tesseract-ocr-all (all ~130 languages) +
  # poppler-utils + ghostscript and fails the build if eng/urd are missing.
  #
  # Note: with the Docker runtime you must NOT set buildCommand or
  # startCommand - the Dockerfile owns both.
  # ---------------------------------------------------------------------------
  - type: web
    name: pdfmaster
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      # Tesseract binary inside the image. The Dockerfile sets the same value,
      # so this is belt-and-braces documentation for anyone reading the
      # Render dashboard.
      - key: TESSERACT_CMD
        value: "/usr/bin/tesseract"
      # OCR limits tuned for a small instance (keep memory well under 512 MB).
      - key: OCR_MAX_PAGES
        value: "30"
      - key: OCR_MAX_FILE_SIZE
        value: "20971520"
      - key: OCR_DPI
        value: "200"
      - key: OCR_PAGE_TIMEOUT
        value: "60"
      # One gunicorn worker: each OCR run holds a whole page image in RAM, so
      # extra workers multiply peak memory on a small instance.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: AI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "groq"
      - key: AI_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: AI_DEFAULT_MODEL
        value: "openai/gpt-oss-120b"
      - key: AI_TIMEOUT_SECONDS
        value: "30"

