{% extends 'base.html' %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="page-title">PDF Tools</h1>
        <p class="page-subtitle">Choose a tool to get started</p>
        <div class="tools-grid">
            {% for tool in tools %}
            <div class="tool-card">
                <div class="tool-icon">{{ tool.icon }}</div>
                <h3>{{ tool.name }}</h3>
                <p>{{ tool.description }}</p>
                <span class="badge">Free</span>
                <a href="{% url tool.url %}" class="btn btn-primary btn-block">Open Tool</a>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
