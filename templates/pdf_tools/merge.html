{% extends 'base.html' %}
{% block content %}
<section class="section">
    <div class="container">
        <h1 class="page-title">Merge PDF</h1>
        <p class="page-subtitle">Combine multiple PDF files into one document</p>
        
        <div class="tool-container">
            <form method="post" enctype="multipart/form-data" id="mergeForm">
                {% csrf_token %}
                <div class="upload-area" id="dropZone">
                    <input type="file" name="files" multiple accept=".pdf" class="file-input" style="display:none" id="fileInput">
                    <div class="upload-content" onclick="document.getElementById('fileInput').click()">
                        <span class="upload-icon">📄</span>
                        <h3>Drop your PDFs here</h3>
                        <p>or <a href="#" onclick="document.getElementById('fileInput').click(); return false;">choose files</a></p>
                        <p class="upload-hint">Multiple PDF files supported</p>
                    </div>
                </div>
                <div id="fileList" class="file-list"></div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-large">Merge PDFs</button>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
